<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lámpara interactiva · Login</title>
<style>
:root{
  color-scheme: dark; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg:#0a0b0f; --panel:#12151c; --field:#0e1117; --text:#eceef3; --muted:#8a91a1; --line:#262c3a;
  --c:#ffb84a; --shade:#ece9e2;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0a0b0f; --panel:#12151c; --field:#0e1117; --text:#eceef3; --muted:#8a91a1; --line:#262c3a; } }
:root[data-theme="dark"]{ --bg:#0a0b0f; --panel:#12151c; --field:#0e1117; --text:#eceef3; --muted:#8a91a1; --line:#262c3a; }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 36%,#171a24 0,transparent 58%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;transition:background .7s ease}
.bg{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .6s;
  background:radial-gradient(circle at 50% 62%,color-mix(in srgb,var(--c) 22%,transparent),transparent 58%)}
body[data-on="true"] .bg{opacity:1}\nbody[data-on="true"]{background:radial-gradient(ellipse at 49% 58%,color-mix(in srgb,var(--c) 10%,#171a24) 0,transparent 58%),var(--bg)}
.sparks{position:fixed;inset:0;pointer-events:none}
.p{position:absolute;border-radius:50%;background:var(--c);opacity:0;box-shadow:0 0 6px var(--c)}
body[data-on="true"] .p{animation:fl var(--d) ease-in-out var(--dl) infinite}
@keyframes fl{0%,100%{opacity:0;transform:translateY(0)}50%{opacity:.8;transform:translateY(-22px)}}

.stage{position:relative;isolation:isolate;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,380px);gap:clamp(24px,4vw,48px);align-items:center;max-width:1100px;margin:0 auto;padding:clamp(24px,4vw,44px)}\n.stage::before{content:"";position:absolute;z-index:-1;width:70%;aspect-ratio:1;left:8%;top:50%;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 12%,transparent),transparent 68%);filter:blur(14px);opacity:.65;pointer-events:none;transition:background .7s ease,opacity .7s ease}
.stage>svg{height:min(84vh,660px);width:auto;max-width:100%;justify-self:center;overflow:visible;touch-action:none;filter:drop-shadow(0 24px 32px #0007);animation:scene-in .8s cubic-bezier(.2,.7,.2,1) both}\n@keyframes scene-in{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.light{opacity:0;transition:opacity .5s}
body[data-on="true"] .light{opacity:1}
#bulb{fill:#4a4f5c;opacity:0;transition:fill .3s,opacity .3s}
body[data-on="true"] #bulb{fill:color-mix(in srgb,var(--c) 35%,#fff);opacity:1;filter:drop-shadow(0 0 5px var(--c)) drop-shadow(0 0 14px var(--c))}
#shade{fill:url(#dome);stroke:color-mix(in srgb,var(--shade) 65%,#000);stroke-width:1}
.bd{fill:url(#softMetal)}.tp{fill:url(#metalFinish)}
.arm{stroke:url(#metalFinish);stroke-linecap:round}.armo{stroke:color-mix(in srgb,var(--shade) 52%,#000);stroke-linecap:round}.arm,.armo{fill:none}.arm-glint{fill:none;stroke:#fff;stroke-opacity:.48;stroke-width:1.1;stroke-linecap:round;pointer-events:none}
.bd,.tp,.arm,.armo,#shade{transition:fill .4s,stroke .4s}
.bsh{opacity:.3;transition:opacity .6s}body[data-on="true"] .bsh{opacity:1}
.pull{cursor:grab;touch-action:none}
#toy{cursor:grab;touch-action:none;outline:none}
#toy:focus-visible{filter:drop-shadow(0 0 5px var(--c))}
#toy.dragging{cursor:grabbing}
.toy-motion{transform-box:view-box;transform-origin:0 0}
.toy-motion.bounce{animation:toy-bounce .56s cubic-bezier(.3,.05,.25,1)}
@keyframes toy-bounce{0%{transform:translateY(0) rotate(0) scale(1)}28%{transform:translateY(-30px) rotate(-12deg) scale(.98,1.02)}52%{transform:translateY(0) rotate(9deg) scale(1.04,.96)}70%{transform:translateY(-10px) rotate(-4deg) scale(.99,1.01)}100%{transform:translateY(0) rotate(0) scale(1)}}
#cord{transform-box:fill-box;transform-origin:top;transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
#knob{transition:transform .28s cubic-bezier(.3,1.6,.5,1)}
.drag #cord,.drag #knob{transition:none}
#knob:focus-visible{outline:2px solid var(--c);outline-offset:4px}

.panel{position:fixed;top:0;left:0;margin:calc(14px + env(safe-area-inset-top,0px)) 14px 0;padding:11px 13px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--line) 78%,#fff);border-radius:16px;box-shadow:0 14px 40px #0008, inset 0 1px #ffffff0b;display:grid;gap:9px;z-index:5}
.row{display:flex;align-items:center;gap:7px}
.row span{font-size:11px;color:var(--muted);min-width:54px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .15s,border-color .15s}
.dot:hover{transform:scale(1.15)} .dot.sel{border-color:#fff;box-shadow:0 0 0 2px #ffffff20}
#lightRow{transition:opacity .3s}
body[data-on="false"] #lightRow{display:none}
.panel{opacity:0;transition:opacity .9s}
.panel.show{opacity:1;transition-duration:.3s}
#lightRow{align-items:flex-start}
#wheel{width:132px;height:132px;display:block;overflow:visible}
#wheel path,#wheel circle{stroke:var(--panel);stroke-width:.6;transition:transform .15s}

.card{position:relative;isolation:isolate;background:radial-gradient(ellipse at 100% 0,color-mix(in srgb,var(--c) 8%,transparent),transparent 48%),linear-gradient(155deg,#1b1f29 0%,#12151d 58%,#0e1117 100%);border:1px solid color-mix(in srgb,var(--line) 82%,#fff);border-radius:28px;padding:30px 26px;box-shadow:0 28px 72px #0009,inset 0 1px #ffffff0b;transition:opacity 1s .25s,filter 1s .25s,transform 1s .25s,border-color .6s,box-shadow 1s .25s,background .6s}
body[data-on="false"] .card{opacity:0;filter:blur(10px);transform:translateY(10px);visibility:hidden;transition:opacity .9s,filter .9s,transform .9s,visibility 0s .9s}
body[data-on="true"] .card{border-color:color-mix(in srgb,var(--c) 30%,var(--line));box-shadow:-40px 0 90px -40px color-mix(in srgb,var(--c) 45%,transparent),0 20px 60px #0008}
h1{font-size:26px;margin:0 0 4px} .sub{font-size:13px;color:var(--muted);margin:0 0 18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:16px}
.tab{background:none;border:0;color:var(--muted);padding:9px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer;transition:background .2s ease,color .2s ease,transform .2s ease}
.tab:hover{color:var(--text)}.tab.on{background:linear-gradient(135deg,#303645,#242a36);color:var(--text);box-shadow:0 2px 8px #0005}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
.f{position:relative}
.f input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:13px 40px 13px 14px;color:var(--text);font:inherit;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.f input:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;padding:8px;font-size:15px;transition:color .2s,scale .2s}.eye:hover{color:var(--text);scale:1.08}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:14px 0}
.meta input{accent-color:var(--c);margin-right:6px} .meta a{color:var(--c);text-decoration:none}
.go{width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;color:#1a1305;cursor:pointer;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 70%,#fff));box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .15s}
.go{background-size:140% 100%;background-position:0 0;transition:transform .18s ease,box-shadow .22s ease,background-position .3s ease}.go:hover{transform:translateY(-1px);background-position:100% 0;box-shadow:0 12px 30px color-mix(in srgb,var(--c) 38%,transparent)}.go:active{transform:scale(.985)}
.or{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.12em;color:var(--muted);margin:18px 0 12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.soc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.soc button{background:linear-gradient(145deg,#151923,#10131a);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px;font:inherit;font-size:12px;cursor:pointer;transition:transform .18s ease,border-color .18s ease,background .18s ease}.soc button:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 55%,var(--line));background:#1a1f29}
.msg{min-height:18px;font-size:12px;color:var(--c);text-align:center;margin:12px 0 0}
.hint{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:var(--muted);pointer-events:none}
[hidden]{display:none!important}
@media (max-width:760px){
  .stage{min-height:100svh;grid-template-columns:minmax(0,1fr);gap:18px;padding:calc(104px + env(safe-area-inset-top,0px)) 18px calc(72px + env(safe-area-inset-bottom,0px))}
  .stage::before{width:100%;left:0;top:27%;opacity:.48}
  .stage>svg{height:min(42svh,360px);max-height:46vh}
  .card{width:100%;max-width:460px;justify-self:center;padding:24px 20px;border-radius:24px}
  #wheel{width:96px;height:96px}
  .hint{font-size:12px;padding:0 18px}
}\n@media (max-width:380px){.stage{padding-left:14px;padding-right:14px}.card{padding:22px 17px}.soc{gap:6px}}\n@media (max-height:650px) and (max-width:760px){.stage{padding-top:82px;gap:12px}.stage>svg{height:34svh;max-height:38vh}.card{padding:20px 18px}}\n@media (prefers-reduced-motion:reduce){.stage>svg{animation:none}*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body data-on="false">
<div class="bg"></div><div class="sparks" id="sparks"></div>

<div class="panel">
  <div class="row"><span>Lámpara</span><div class="row" id="shades"></div></div>
  <div class="row" id="lightRow"><span>Luz</span><svg id="wheel" viewBox="-70 -70 140 140" role="group" aria-label="Rueda de color de la luz"></svg></div>
</div>

<main class="stage">
<svg viewBox="0 0 400 600" role="group" aria-label="Escena con lámpara articulada y pelota interactiva">
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--c);stop-opacity:.65"/>
      <stop offset=".4" style="stop-color:var(--c);stop-opacity:.18"/>
      <stop offset="1" style="stop-color:var(--c);stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:color-mix(in srgb,var(--shade) 80%,#fff)"/>
      <stop offset=".4" style="stop-color:var(--shade)"/>
      <stop offset="1" style="stop-color:color-mix(in srgb,var(--shade) 72%,#000)"/>
    </linearGradient>
    <linearGradient id="metalFinish" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:color-mix(in srgb,var(--shade) 38%,#000)"/>
      <stop offset=".16" style="stop-color:color-mix(in srgb,var(--shade) 54%,#fff)"/>
      <stop offset=".34" style="stop-color:var(--shade)"/>
      <stop offset=".58" style="stop-color:color-mix(in srgb,var(--shade) 70%,#000)"/>
      <stop offset=".78" style="stop-color:color-mix(in srgb,var(--shade) 62%,#fff)"/>
      <stop offset="1" style="stop-color:color-mix(in srgb,var(--shade) 48%,#000)"/>
    </linearGradient>
    <linearGradient id="softMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:color-mix(in srgb,var(--shade) 82%,#fff)"/>
      <stop offset=".48" style="stop-color:var(--shade)"/>
      <stop offset="1" style="stop-color:color-mix(in srgb,var(--shade) 55%,#000)"/>
    </linearGradient>
    <linearGradient id="shadeSheen" x1="0" y1="0" x2="1" y2=".2">
      <stop offset="0" stop-color="#fff" stop-opacity=".48"/><stop offset=".24" stop-color="#fff" stop-opacity=".12"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="bolt" cx=".3" cy=".25" r=".8">
      <stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#dfe4ed"/><stop offset=".58" stop-color="#7f8795"/><stop offset="1" stop-color="#303541"/>
    </radialGradient>
    <radialGradient id="ballG" cx=".32" cy=".24" r=".86">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".24" stop-color="#fff" stop-opacity=".22"/><stop offset=".58" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#10151e" stop-opacity=".48"/>
    </radialGradient>
    <clipPath id="ballClip"><circle r="29"/></clipPath>
    <linearGradient id="fadeG" gradientUnits="userSpaceOnUse" x1="0" y1="470" x2="0" y2="590"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
    <mask id="floorMask" maskUnits="userSpaceOnUse" x="-300" y="0" width="1200" height="600"><rect x="-300" y="0" width="1200" height="600" fill="url(#fadeG)"/></mask>
    <radialGradient id="pool"><stop offset="0" style="stop-color:var(--c);stop-opacity:.65"/><stop offset=".6" style="stop-color:var(--c);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--c);stop-opacity:0"/></radialGradient>
    <clipPath id="beamClip"><polygon transform="translate(210 266) rotate(-40)" points="-60,0 60,0 175,460 -175,460"/></clipPath>
    <linearGradient id="bsh" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".85"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="floorSurface" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202633" stop-opacity=".28"/><stop offset=".38" stop-color="#11151e" stop-opacity=".78"/><stop offset="1" stop-color="#090b11" stop-opacity=".1"/></linearGradient>
    <radialGradient id="groundLight" cx=".46" cy=".45" r=".65"><stop offset="0" style="stop-color:var(--c);stop-opacity:.25"/><stop offset=".45" style="stop-color:var(--c);stop-opacity:.11"/><stop offset="1" stop-color="#10151e" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <g id="bars">
      <line x1="125.8" y1="534.4" x2="85.8" y2="393.4"/><line x1="114.2" y1="537.6" x2="74.2" y2="396.6"/>
      <line x1="85.5" y1="397.4" x2="155.5" y2="237.4"/><line x1="74.5" y1="392.6" x2="144.5" y2="232.6"/>
    </g>
  </defs>

  <ellipse cx="200" cy="579" rx="215" ry="30" fill="url(#floorSurface)"/>
  <path d="M8 586 Q200 576 392 586" fill="none" stroke="#414957" stroke-opacity=".24" stroke-width="1"/>
  <ellipse class="light" cx="265" cy="575" rx="174" ry="28" fill="url(#groundLight)" filter="url(#haze)"/>
  <g class="light" mask="url(#floorMask)"><g transform="translate(210 266) rotate(-40)">
    <g id="rays" filter="url(#soft)"></g>
    <polygon points="-60,0 60,0 160,460 -160,460" fill="url(#cone)" opacity=".35"/>
    <g filter="url(#haze)" style="fill:var(--c);fill-opacity:.14"><ellipse cx="-30" cy="330" rx="70" ry="22"/><ellipse cx="40" cy="390" rx="80" ry="26"/><ellipse cx="-60" cy="250" rx="45" ry="16"/><ellipse cx="60" cy="280" rx="55" ry="18"/></g>
  </g></g>
  <g class="light"><ellipse cx="410" cy="580" rx="118" ry="13" fill="url(#pool)" filter="url(#soft)"/></g>

  <!-- base -->
  <ellipse cx="108" cy="582" rx="78" ry="9" fill="#000" opacity=".4"/>
  <ellipse class="bd" cx="120" cy="574" rx="74" ry="11"/>
  <ellipse class="tp" cx="120" cy="568" rx="74" ry="11"/>
  <ellipse cx="120" cy="566" rx="50" ry="6.5" fill="none" stroke="#000" stroke-opacity=".18"/>
  <ellipse cx="120" cy="565" rx="39" ry="4.2" fill="none" stroke="#fff" stroke-opacity=".28"/>
  <rect class="tp" x="106" y="532" width="28" height="34" rx="5"/>
  <path d="M109 537v7m0 12v5" stroke="#fff" stroke-opacity=".3" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M106,546H134M106,552H134" stroke="#000" stroke-opacity=".15"/>

  <!-- brazos paralelos y resorte -->
  <use href="#bars" class="armo" stroke-width="8"/>
  <use href="#bars" class="arm" stroke-width="5"/>
  <use href="#bars" class="arm-glint" stroke-width="1.1"/>
  <path d="M99,440 L105,428.6 96,415.7 107,404.8 98,391.9 109,381 100,368.1 111,357.2 108,345" fill="none" stroke="#272d39" stroke-width="4" stroke-linejoin="round"/>
  <path d="M99,440 L105,428.6 96,415.7 107,404.8 98,391.9 109,381 100,368.1 111,357.2 108,345" fill="none" stroke="url(#metalFinish)" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M100 438l3-5m-5-18 3-4m-3-16 3-4m-3-16 3-4m-3-16 3-4" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width=".8"/>
  <g fill="url(#bolt)" stroke="#303541" stroke-width="1.2">
    <circle cx="120" cy="536" r="9"/><circle cx="80" cy="395" r="9"/>
  </g>
  <g fill="#fff" opacity=".78"><circle cx="117.5" cy="533.5" r="1.7"/><circle cx="77.5" cy="392.5" r="1.7"/></g>
  <g fill="#3b414d"><circle cx="122.5" cy="538.5" r="1.2"/><circle cx="82.5" cy="397.5" r="1.2"/></g>

  <!-- pantalla cónica -->
  <g transform="translate(210 266) rotate(-40)">
    
    <path id="shade" d="M-62,0 L-16,-80 Q0,-86 16,-80 L62,0 Z"/>
    <path d="M-62,0 L-16,-80 Q0,-86 16,-80 L62,0 Z" fill="url(#shadeSheen)" pointer-events="none"/>
    <path d="M-44,-8 L-14,-70" stroke="#fff" stroke-opacity=".58" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-38,-12 L-16,-62" stroke="#fff" stroke-opacity=".2" stroke-width="1" stroke-linecap="round"/>
    <g stroke="#000" stroke-opacity=".25" stroke-width="2" stroke-linecap="round">
      <line x1="-10" y1="-72" x2="10" y2="-72"/><line x1="-13" y1="-64" x2="13" y2="-64"/><line x1="-16" y1="-56" x2="16" y2="-56"/>
    </g>
    <ellipse cx="0" cy="0" rx="62" ry="9" style="fill:color-mix(in srgb,var(--shade) 55%,#000)"/>
    <ellipse class="light" cx="0" cy="0" rx="58" ry="7" style="fill:var(--c)"/>
    <ellipse cx="0" cy="0" rx="62" ry="9" fill="none" style="stroke:color-mix(in srgb,var(--shade) 70%,#000)" stroke-width="2"/>
    <circle id="bulb" cx="0" cy="0" r="7"/>
  </g>
  <circle cx="150" cy="235" r="10" fill="url(#bolt)" stroke="#252a34" stroke-width="1.3"/>
  <circle cx="147.5" cy="232.5" r="1.8" fill="#fff" opacity=".8"/>
  <circle cx="151.5" cy="236.5" r="1.2" fill="#333945"/>

  <!-- cadena -->
  <g class="pull" id="pull">
    <g id="cordSwing">
      <line id="cord" x1="164" y1="306" x2="164" y2="416" stroke="#9aa0ad" stroke-width="2.2" stroke-dasharray="1.6 2.6" stroke-linecap="round"/>
      <path d="M164 306v110" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width=".65"/>
      <circle cx="164" cy="430" r="18" fill="transparent" pointer-events="all"/>
      <path id="knob" d="M164,418 C171,428 172,436 164,440 C156,436 157,428 164,418 Z" fill="url(#bolt)" stroke="#565d69" stroke-width=".9" tabindex="0" role="button" aria-label="Jalar la cadena para encender o apagar"/>
      <path d="M161 423q3-3 5 0" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.1" stroke-linecap="round" pointer-events="none"/>
    </g>
  </g>

  <!-- pelota de juguete -->
  <g id="toy" transform="translate(300 556)" role="button" tabindex="0" aria-label="Pelota de juguete. Toca para hacerla rebotar o arrástrala para moverla.">
    <ellipse class="bsh" cx="54" cy="28" rx="63" ry="7" fill="url(#bsh)"/><ellipse cx="0" cy="29" rx="24" ry="4" fill="#000" opacity=".36"/>
    <g class="toy-motion" id="toyMotion">
      <g clip-path="url(#ballClip)">
        <circle r="29" fill="#71d7c5"/>
        <path d="M-32,-9 Q0,-37 32,-5" fill="none" stroke="#23365f" stroke-width="13" stroke-linecap="round"/>
        <path d="M-28,-12 Q0,-34 28,-7" fill="none" stroke="#7f91c2" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round"/>
        <polygon points="0,-11 2.6,-3.6 10.5,-3.4 4.3,1.4 6.5,8.9 0,4.5 -6.5,8.9 -4.3,1.4 -10.5,-3.4 -2.6,-3.6" fill="#f16052" stroke="#7c2b35" stroke-width="2" stroke-linejoin="round" transform="translate(-3 8) scale(.92)"/>
        <polygon points="0,-11 2.6,-3.6 10.5,-3.4 4.3,1.4 6.5,8.9 0,4.5 -6.5,8.9 -4.3,1.4 -10.5,-3.4 -2.6,-3.6" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width=".8" stroke-linejoin="round" transform="translate(-3 7.5) scale(.92)"/>
        <path d="M-27,13 Q-12,24 5,20 M8,-22 Q18,-18 24,-8" fill="none" stroke="#e7fffb" stroke-opacity=".65" stroke-width="1.25" stroke-linecap="round"/>
        <ellipse cx="-10" cy="-16" rx="8" ry="3.2" transform="rotate(-32 -10 -16)" fill="#fff" opacity=".58" filter="url(#soft)"/>
        <circle r="29" fill="url(#ballG)"/>
        <circle r="28.5" fill="none" stroke="#e5fff8" stroke-opacity=".55" stroke-width="1"/>
        <g class="light"><circle r="29" style="fill:var(--c);fill-opacity:.15"/></g>
      </g>
    </g>
  </g>
</svg>

<section class="card" id="card" inert>
  <h1 id="title">Bienvenido</h1>
  <p class="sub">Inicia sesión para continuar</p>
  <div class="tabs"><button class="tab on" data-m="in" type="button">Entrar</button><button class="tab" data-m="up" type="button">Registro</button></div>
  <form id="form" autocomplete="on">
    <div id="mailRow" hidden><label for="mail">Correo</label><div class="f"><input id="mail" type="email" autocomplete="email" placeholder="tu@correo.com"></div></div>
    <label for="user">Usuario o correo</label>
    <div class="f"><input id="user" type="text" autocomplete="username" required placeholder="MiUsuario"></div>
    <label for="pw">Contraseña</label>
    <div class="f"><input id="pw" type="password" autocomplete="current-password" required placeholder="••••••••"><button class="eye" id="eye" type="button" aria-label="Mostrar contraseña">👁</button></div>
    <div class="meta"><label style="margin:0"><input type="checkbox" checked>Recordarme</label><a href="#" onclick="return false">¿Olvidaste?</a></div>
    <button class="go" id="go" type="submit">Entrar →</button>
    <p class="msg" id="msg"></p>
  </form>
  <div class="or">O CONTINÚA CON</div>
  <div class="soc"><button type="button">Google</button><button type="button">GitHub</button><button type="button">Apple</button></div>
</section>
</main>

<p class="hint" id="hint">Jala la cadena para encender</p>

<script>
const root=document.documentElement;
const readPref=(key,fallback)=>{try{return localStorage.getItem(key)||fallback}catch{return fallback}};
const savePref=(key,value)=>{try{localStorage.setItem(key,value)}catch{}};
root.style.setProperty("--shade",readPref("lamp-shade","#ece9e2"));
root.style.setProperty("--c",readPref("lamp-light","hsl(37.5, 100%, 60%)"));
const shades=["#ece9e2","#f2b8c6","#9fd3d6","#f3d089","#2a2e37"];
const lights=["#ffb84a","#ff5fa2","#5ee7ff","#7dff9b","#b388ff"];
function dots(id,list,v){
  const box=document.getElementById(id);
  const selected=getComputedStyle(root).getPropertyValue(v).trim().toLowerCase();
  list.forEach((col,i)=>{
    const active=col.toLowerCase()===selected;
    const b=document.createElement("button");
    b.className="dot"+(active?" sel":""); b.style.background=col; b.setAttribute("aria-label","Color "+col); b.setAttribute("aria-pressed",String(active));
    b.onclick=()=>{root.style.setProperty(v,col);savePref(v==="--shade"?"lamp-shade":"lamp-light",col);box.querySelectorAll(".dot").forEach(d=>{d.classList.remove("sel");d.setAttribute("aria-pressed","false")});b.classList.add("sel");b.setAttribute("aria-pressed","true")};
    box.appendChild(b);
  });
}
dots("shades",shades,"--shade"); const wheel=document.getElementById("wheel"),SV="http://www.w3.org/2000/svg";
let cur=null,init=null;
function pick(el,col,save=true){
  root.style.setProperty("--c",col);
  if(save)savePref("lamp-light",col);
  if(cur){cur.style.stroke="";cur.style.strokeWidth=""}
  cur=el; el.style.stroke="#fff"; el.style.strokeWidth="1.8"; wheel.appendChild(el);
}
const P=(r,a)=>[r*Math.cos(a),r*Math.sin(a)].map(n=>n.toFixed(2)).join(" ");
const Ls=[50,60,70,80,90];
for(let k=0;k<5;k++)for(let i=0;i<24;i++){
  const r1=68-k*11.2,r0=r1-11.2,a0=(i*15-90)*Math.PI/180,a1=((i+1)*15-90)*Math.PI/180;
  const col=`hsl(${i*15+7.5},100%,${Ls[k]}%)`,p=document.createElementNS(SV,"path");
  p.setAttribute("d",`M${P(r1,a0)}A${r1} ${r1} 0 0 1 ${P(r1,a1)}L${P(r0,a1)}A${r0} ${r0} 0 0 0 ${P(r0,a0)}Z`);
  p.setAttribute("fill",col); p.setAttribute("role","button"); p.setAttribute("tabindex","0"); p.setAttribute("aria-label","Luz "+col); p.style.cursor="pointer";
  p.addEventListener("click",()=>pick(p,col));
  wheel.appendChild(p);
  if(i===2&&k===1)init=[p,col];
}
const mid=document.createElementNS(SV,"circle");
mid.setAttribute("r",12); mid.setAttribute("fill","#fff"); mid.setAttribute("role","button"); mid.setAttribute("tabindex","0"); mid.setAttribute("aria-label","Luz blanca"); mid.style.cursor="pointer";
mid.addEventListener("click",()=>pick(mid,"#ffffff")); wheel.appendChild(mid);
const storedLight=readPref("lamp-light","");
pick(init[0],storedLight||init[1],false);
wheel.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("path,circle")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});

/* la rueda se oculta sola */
const row=document.querySelector(".panel");
let wTimer,wShown=false,inside=false,blockClick=false;
function wheelShow(){wShown=true;row.classList.add("show");clearTimeout(wTimer);if(!inside)wTimer=setTimeout(wheelHide,4000)}
function wheelHide(){wShown=false;clearTimeout(wTimer);row.classList.remove("show")}
row.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse"){inside=true;wheelShow()}});
row.addEventListener("pointerleave",()=>{inside=false;if(wShown){clearTimeout(wTimer);wTimer=setTimeout(wheelHide,4000)}});
row.addEventListener("pointerdown",()=>{blockClick=!wShown;wheelShow()},true);
row.addEventListener("click",e=>{if(blockClick){e.stopPropagation();e.preventDefault();blockClick=false}},true);
wheelShow();

const sp=document.getElementById("sparks");
for(let i=0;i<30;i++){
  const p=document.createElement("span"),s=1.5+Math.random()*2.5;
  p.className="p"; p.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;--d:${6+Math.random()*7}s;--dl:${-Math.random()*8}s`;
  sp.appendChild(p);
}

let on=false;
const card=document.getElementById("card");
function toggle(){
  on=!on; document.body.dataset.on=on; card.inert=!on;
  setTimeout(wheelShow,40);
  document.getElementById("hint").textContent=on?"Toca o pasa el mouse sobre la esquina para elegir el color de la luz, o jala la cadena para apagar":"Jala la cadena para encender";
}
const knob=document.getElementById("knob"),cord=document.getElementById("cord"),pull=document.getElementById("pull"),cordSwing=document.getElementById("cordSwing"),svg=document.querySelector("svg");
function setPull(amount){knob.style.transform=`translateY(${amount}px)`;cord.style.transform=`scaleY(${(110+amount)/110})`}
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function svgPoint(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
let drag=false,dy=0,swingAngle=0,swingVelocity=0,swingFrame=0,lastFrame=0,startPoint=null,lastPointerAngle=0,lastPointerTime=0,moved=0;
function paintSwing(){cordSwing.setAttribute("transform",`rotate(${swingAngle*180/Math.PI} 164 306)`)}
function animateSwing(now){
  if(drag)return;
  if(!lastFrame)lastFrame=now;
  const dt=Math.min((now-lastFrame)/1000,.032);lastFrame=now;
  swingVelocity+=(-7.2*Math.sin(swingAngle)-1.18*swingVelocity)*dt;
  swingAngle+=swingVelocity*dt;
  paintSwing();
  if(Math.abs(swingAngle)>.003||Math.abs(swingVelocity)>.008){swingFrame=requestAnimationFrame(animateSwing)}
  else{swingAngle=0;swingVelocity=0;lastFrame=0;paintSwing()}
}
pull.addEventListener("pointerdown",e=>{
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();drag=true;dy=0;moved=0;startPoint=svgPoint(e);
  const point=svgPoint(e);lastPointerAngle=Math.atan2(point.x-164,point.y-306);lastPointerTime=e.timeStamp;
  swingVelocity=0;pull.setPointerCapture(e.pointerId);pull.classList.add("drag")
});
pull.addEventListener("pointermove",e=>{
  if(!drag)return;
  const p=svgPoint(e),radius=Math.hypot(p.x-164,p.y-306),next=clamp(Math.atan2(p.x-164,p.y-306),-1.38,1.38);
  const dt=Math.max(.008,(e.timeStamp-lastPointerTime)/1000);
  swingVelocity=clamp((next-lastPointerAngle)/dt,-7,7);swingAngle=next;
  lastPointerAngle=next;lastPointerTime=e.timeStamp;
  moved=Math.hypot(p.x-startPoint.x,p.y-startPoint.y);
  dy=clamp(radius-124,0,40);setPull(dy);paintSwing()
});
function releasePull(e){
  if(!drag)return;
  drag=false;pull.classList.remove("drag");
  const tappedHandle=startPoint&&Math.hypot(startPoint.x-164,startPoint.y-430)<19&&moved<8;
  if(dy>14||tappedHandle)toggle();
  if(dy>14&&Math.abs(swingAngle)<.06)swingVelocity+=.85;
  setPull(0);lastFrame=0;cancelAnimationFrame(swingFrame);swingFrame=requestAnimationFrame(animateSwing)
}
pull.addEventListener("pointerup",releasePull);pull.addEventListener("pointercancel",releasePull);
knob.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();setPull(24);setTimeout(()=>setPull(0),150);toggle();swingVelocity=.9;lastFrame=0;cancelAnimationFrame(swingFrame);swingFrame=requestAnimationFrame(animateSwing)}
});
const toy=document.getElementById("toy"),toyMotion=document.getElementById("toyMotion");
let toyX=300,toyRotation=0,toyStart=null,toyStartX=300,toyMoved=false,toyLastX=0;
function bounceToy(){toyMotion.classList.remove("bounce");void toyMotion.getBoundingClientRect();toyMotion.classList.add("bounce")}
toyMotion.addEventListener("animationend",()=>toyMotion.classList.remove("bounce"));
toy.addEventListener("pointerdown",e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();toyStart=svgPoint(e);toyStartX=toyX;toyLastX=toyStart.x;toyMoved=false;toy.setPointerCapture(e.pointerId);toy.classList.add("dragging")});
toy.addEventListener("pointermove",e=>{if(!toyStart)return;const p=svgPoint(e),delta=p.x-toyStart.x;if(Math.abs(delta)>5)toyMoved=true;if(toyMoved){toyX=clamp(toyStartX+delta,218,355);toyRotation+=(p.x-toyLastX)*1.4;toyLastX=p.x;toy.setAttribute("transform",`translate(${toyX} 556) rotate(${toyRotation})`)}});
function releaseToy(){if(!toyStart)return;toy.classList.remove("dragging");if(!toyMoved)bounceToy();toyStart=null}
toy.addEventListener("pointerup",releaseToy);toy.addEventListener("pointercancel",releaseToy);
toy.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();bounceToy()}});

/* rayos del haz */
const NS="http://www.w3.org/2000/svg",rays=document.getElementById("rays");
const R=n=>{const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)};
for(let i=0;i<26;i++){
  const u=(i/25)*2-1,a=u*17*Math.PI/180+(R(i)-.5)*.03,len=460,x0=u*50,w=1+R(i+9)*5;
  const xe=x0+Math.tan(a)*len,p=document.createElementNS(NS,"polygon");
  p.setAttribute("points",`${x0-1},0 ${x0+1},0 ${xe+w},${len} ${xe-w},${len}`);
  p.setAttribute("fill","url(#cone)");
  p.setAttribute("opacity",((.25+.5*R(i+3))*(1-.4*Math.abs(u))).toFixed(2));
  rays.appendChild(p);
}

/* formulario */
const msg=document.getElementById("msg");
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  const up=t.dataset.m==="up";
  document.getElementById("mailRow").hidden=!up;
  document.getElementById("mail").required=up;
  pw.autocomplete=up?"new-password":"current-password";
  document.getElementById("go").textContent=up?"Crear cuenta →":"Entrar →";
  document.getElementById("title").textContent=up?"Crea tu cuenta":"Bienvenido";
  msg.textContent="";
});
const pw=document.getElementById("pw");
document.getElementById("eye").onclick=()=>{const show=pw.type==="password";pw.type=show?"text":"password";document.getElementById("eye").setAttribute("aria-label",show?"Ocultar contraseña":"Mostrar contraseña")};
document.getElementById("form").onsubmit=e=>{e.preventDefault();msg.textContent="Demostración: aquí conectarías tu servidor."};
</script>
</body>
